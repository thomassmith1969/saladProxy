[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salad_proxy"
version = "0.1.0"
description = "Local reverse proxy that injects Salad-Api-Key"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
salad_proxy = "salad_proxy.proxy:main"
salad-proxy = "salad_proxy.proxy:main"

[tool.setuptools]
packages = ["salad_proxy"]
